[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analyzer"
version = "0.1.0"
description = "Scv and jsonl files analyzer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "Krivtsov Iaroslav", email = "iarkiy_mai@mail.ru"}]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=7.0"
]

[project.scripts]
my-cli = "my_project.cli:main"

[project.urls]
Homepage = "https://github.com/IarKri"
Repository = "https://github.com/IarKri/MAI_1COURSE_2LAB_ANALYZER"